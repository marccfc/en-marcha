<!doctype html>

  <head>

    <!-- Estilos críticos V2 en línea: protegen la interfaz si un móvil conserva una CSS antigua. -->
    <style>
      .topbar-actions{display:flex;align-items:center;gap:10px}.handoff-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.queue-count{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#eafaf5;color:#177d62;font-size:12px;font-weight:800}.queue-count.ainhoa{background:#fff2e4;color:#b86e18}.video-list{padding:12px}.video-card{margin-bottom:9px;padding:14px;border:1px solid #edf0f5;border-radius:13px;background:#fff;cursor:pointer}.video-card:last-child{margin-bottom:0}.video-card.overdue{border-left:3px solid #e58a7d}.video-card-top,.video-card-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}.video-card h3{margin:10px 0 12px;font-size:13px;line-height:1.35}.video-card-bottom>span:last-child,.video-card-next{color:#69758a;font-size:10px;font-weight:700}.video-card-next{margin:9px 0 0;font-size:11px;font-weight:400}.channel-pill{display:inline-flex;align-items:center;gap:5px;color:#59677f;font-size:10px;font-weight:800;letter-spacing:.055em;text-transform:uppercase}.channel-pill i{display:inline-block;width:6px;height:6px;border-radius:50%}.owner-badge,.stage-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800;white-space:nowrap}.owner-badge{background:#eff0ff;color:#6255b7}.owner-badge i{width:5px;height:5px;border-radius:50%;background:#8b7cf6}.owner-badge.ainhoa{background:#fff3e6;color:#b1681a}.owner-badge.ainhoa i{background:#f5a75a}.stage-badge{background:#eef1f5;color:#687389}.stage-badge.script,.stage-badge.production_pack,.stage-badge.editing{background:#efedff;color:#6656c8}.stage-badge.visual{background:#fff4e5;color:#b06b1d}.stage-badge.published{background:#e9f9f2;color:#19785f}.stage-badge.skipped{background:#fff0f0;color:#b65b5b}.idea-filters{display:flex;flex-wrap:wrap;gap:8px;margin:-10px 0 20px}.filter-chip{min-height:34px;padding:7px 11px;border:1px solid #e8ebf2;border-radius:99px;background:#fff;color:#69758a;font-size:11px;font-weight:750}.filter-chip.active{border-color:#121a2b;background:#121a2b;color:#fff}.idea-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.idea-card{display:flex;flex-direction:column;min-height:208px;padding:18px;border:1px solid #e8ebf2;border-radius:16px;background:#fff}.idea-card>div:first-child,.idea-card-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;flex-wrap:wrap}.idea-card h2{margin:17px 0 9px;font-size:16px;line-height:1.25}.idea-card p{margin-bottom:auto;color:#69758a;font-size:12px;line-height:1.5}.idea-card-footer{margin-top:17px;color:#69758a;font-size:10px;font-weight:700}.priority{color:#7a8596;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.priority.high{color:#b85c50}.priority.low{color:#8792a1}.empty-wide{grid-column:1/-1;padding:55px 25px;border:1px dashed #d7dfe9;border-radius:16px;color:#69758a;text-align:center}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}.week-day{min-height:260px;padding:10px;border:1px solid #e8ebf2;border-radius:14px;background:#fff}.week-day.today{border-color:#94ddc4;box-shadow:inset 0 0 0 1px #c6f2e2}.week-day>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#69758a;font-size:10px;font-weight:800;text-transform:uppercase}.week-day>header strong{color:#152033;font-size:13px}.week-day .video-card{margin-bottom:7px;padding:10px}.week-day .video-card h3{margin:8px 0;font-size:11px}.week-day .video-card-bottom{flex-direction:column;align-items:flex-start;gap:5px}.week-day .channel-pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.week-empty{margin:56px 0;color:#a3adbb;font-size:11px;text-align:center}@media(max-width:1080px){.handoff-grid{grid-template-columns:1fr}.idea-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.idea-grid{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(7,180px);scroll-snap-type:x proximity}.week-day{scroll-snap-align:start}.week-day .video-card{padding:11px}.week-day .video-card h3{font-size:12px}.video-list{padding:10px}.video-card{padding:13px}.handoff-grid{gap:15px}}
    </style>
    <!-- V7: la ficha y el tablero diario mantienen su diseño aunque un móvil conserve una CSS anterior. -->
    <style>
      .daily-intro .eyebrow{margin-bottom:8px!important}.daily-task{cursor:pointer;transition:.18s ease}.daily-task:hover{background:#fbfdfd}.daily-task.overdue{border-left:3px solid #e58a7d;padding-left:10px}.daily-task .task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.daily-task-arrow{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:#8b96a8;background:#f3f5f8}.daily-task-arrow svg{width:15px}.late-text{color:#b45c52;font-size:10px;font-weight:800}.detail-modal{width:min(100%,760px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column}.detail-content{overflow-y:auto;padding:20px 24px 24px}.detail-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 14px;background:#f7faf9;border:1px solid #e1eee9;border-radius:13px}.detail-summary .detail-meta{margin:0}.detail-now{display:flex;align-items:center;gap:8px;color:#69758a;font-size:11px;font-weight:750}.workflow-panel{margin:17px 0 20px}.workflow-panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:10px}.section-kicker{display:block;color:#177d62;font-size:9px;font-weight:850;letter-spacing:.11em;margin-bottom:4px}.workflow-panel h3{font-size:15px;margin:0}.workflow-panel p{margin:4px 0 0;color:#69758a;font-size:11px}.advance-stage{flex:0 0 auto;min-height:38px;font-size:11px}.advance-stage span{opacity:.74}.stage-rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:7px}.stage-rail-step{min-width:0;border:1px solid #e8ebf2;border-radius:12px;padding:10px;background:#fff;text-align:left;display:flex;align-items:flex-start;gap:8px}.stage-rail-step.done{background:#f5fcf8;border-color:#d1ecdf}.stage-rail-step.current{border-color:#82d5b6;background:#edf9f3;box-shadow:inset 0 0 0 1px #b9ebd5}.stage-number{width:23px;height:23px;display:grid;place-items:center;flex:0 0 auto;border-radius:8px;background:#f0f2f6;color:#7d8999;font-size:10px;font-weight:850}.stage-number svg{width:13px}.done .stage-number{background:#dff6e9;color:#177d62}.current .stage-number{background:#55d6ae;color:#12352b}.stage-rail-copy{min-width:0;display:grid;gap:5px}.stage-rail-copy strong{font-size:11px;line-height:1.25}.stage-rail-copy .owner-badge{width:max-content;font-size:9px;padding:4px 6px}.detail-form{padding:0!important}.detail-save-bar{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding-top:3px}.detail-save-bar .secondary-button{margin-right:auto}.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding-top:17px;border-top:1px solid #edf0f5}.danger-zone strong{display:block;color:#8f4741;font-size:12px}.danger-zone p{margin:3px 0 0;color:#69758a;font-size:10px;line-height:1.35}.danger-zone .danger-button{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid #f0cfcd;border-radius:9px;background:#fff8f7;padding:0 10px;white-space:nowrap}.danger-zone .danger-button svg{width:14px}@media(max-width:760px){.daily-intro .date-switcher{width:100%;justify-content:space-between}.daily-intro .date-switcher input{max-width:none;flex:1;text-align:center}.daily-task{grid-template-columns:36px minmax(0,1fr) 28px}.daily-task .task-title{white-space:normal}.detail-modal{max-height:calc(100dvh - 20px)}.detail-content{padding:16px}.detail-summary{align-items:flex-start;flex-direction:column}.workflow-panel-head{align-items:flex-start;flex-direction:column}.advance-stage{width:100%}.stage-rail{grid-auto-flow:column;grid-auto-columns:minmax(145px,78vw);grid-template-columns:none;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}.stage-rail-step{scroll-snap-align:start;min-height:76px}.detail-save-bar{align-items:stretch;flex-direction:column}.detail-save-bar .secondary-button{margin:0}.danger-zone{align-items:flex-start;flex-direction:column}.danger-zone .danger-button{width:100%;justify-content:center}}
    </style>
